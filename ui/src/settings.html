<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rules Manager</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1.5rem;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        font-size: 1.25rem;
      }
      button {
        margin-right: 0.5rem;
        margin-top: 0.75rem;
        padding: 0.5rem 0.9rem;
        border-radius: 6px;
        border: 1px solid #14b8a6;
        background: #134e4a;
        color: #ecfdf5;
        cursor: pointer;
      }
      pre {
        background: #020617;
        padding: 0.75rem;
        border-radius: 6px;
        overflow: auto;
        font-size: 0.8rem;
      }
      .muted {
        color: #94a3b8;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Rules Manager</h1>
    <p class="muted">Talks to <code>rulesd</code> on 127.0.0.1:17355. Start the daemon first.</p>
    <button id="refresh">Refresh status</button>
    <button id="compose">Compose now</button>
    <pre id="out">…</pre>
    <script>
      const http = require("http");
      const out = document.getElementById("out");
      function get(path) {
        return new Promise((resolve, reject) => {
          http
            .get({ host: "127.0.0.1", port: 17355, path }, (res) => {
              let d = "";
              res.on("data", (c) => (d += c));
              res.on("end", () => resolve(JSON.parse(d)));
            })
            .on("error", reject);
        });
      }
      function post(path) {
        return new Promise((resolve, reject) => {
          const req = http.request(
            { host: "127.0.0.1", port: 17355, path, method: "POST" },
            (res) => {
              let d = "";
              res.on("data", (c) => (d += c));
              res.on("end", () => resolve(JSON.parse(d)));
            }
          );
          req.on("error", reject);
          req.end();
        });
      }
      async function refresh() {
        try {
          out.textContent = JSON.stringify(await get("/status"), null, 2);
        } catch (e) {
          out.textContent = "unreachable: " + e.message;
        }
      }
      document.getElementById("refresh").onclick = refresh;
      document.getElementById("compose").onclick = async () => {
        try {
          out.textContent = JSON.stringify(await post("/compose"), null, 2);
        } catch (e) {
          out.textContent = String(e);
        }
      };
      refresh();
    </script>
  </body>
</html>
