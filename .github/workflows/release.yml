name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  daemon-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup D
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - name: Build rulesd
        working-directory: daemon
        run: dub build -b release
      - uses: actions/upload-artifact@v4
        with:
          name: rulesd-windows
          path: daemon/rulesd.exe
  ui-note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Electron UI packaged via pnpm dist on release; extend matrix for mac/linux daemon later."
