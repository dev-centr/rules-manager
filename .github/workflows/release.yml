name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rulesd-windows
            binary: rulesd.exe
          - os: ubuntu-latest
            artifact: rulesd-linux
            binary: rulesd
          - os: macos-latest
            artifact: rulesd-macos
            binary: rulesd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup D
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Build rulesd
        working-directory: daemon
        run: dub build -b release
      # Linux and macOS both build "rulesd", so archive per OS: unique release asset
      # names, and tar keeps the executable bit that artifact zips drop.
      - name: Package rulesd
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path daemon/${{ matrix.binary }} -DestinationPath dist/${{ matrix.artifact }}.zip -Force"
          else
            tar -czf dist/${{ matrix.artifact }}.tar.gz -C daemon ${{ matrix.binary }}
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI deps
        working-directory: ui
        run: pnpm install
      - name: Note
        run: echo "Full electron-builder matrix (Win/macOS/Linux AppImage) can run on tagged releases with OS-specific runners."
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [daemon, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rulesd-*
          path: artifacts
          merge-multiple: true
      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release/
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
